<script id="skilled-boot-recovery">(()=>{'use strict';const RELEASE='53',FLAG='skilled_recovery_once_'+RELEASE;async function clearStale(){try{if(!('serviceWorker'in navigator))return false;const controller=navigator.serviceWorker.controller;if(!controller){try{sessionStorage.removeItem(FLAG)}catch(_){}return false}const script=String(controller.scriptURL||'');if(!/crm-sw\.js/i.test(script)||new RegExp('[?&]v='+RELEASE+'(?:&|$)').test(script))return false;try{if(sessionStorage.getItem(FLAG)==='1')return false;sessionStorage.setItem(FLAG,'1')}catch(_){}const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/^skilled-crm/i.test(k)).map(k=>caches.delete(k).catch(()=>false)))}location.reload();return true}catch(_){return false}}clearStale();window.addEventListener('DOMContentLoaded',()=>{const name=(location.pathname.split('/').pop()||'').toLowerCase();if(/^(login|index|limpiar-cache|recuperar-crm)(?:\.html)?$/.test(name))return;setTimeout(()=>{const missing=[];if(!window.SkilledDB)missing.push('conexión');if(!document.getElementById('skilled-sidebar'))missing.push('menú');if(!missing.length)return;if(document.getElementById('skilled-runtime-warning'))return;const box=document.createElement('div');box.id='skilled-runtime-warning';box.style.cssText='position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:2147483647;width:min(620px,calc(100vw - 24px));padding:12px 14px;border:1px solid #ef4444;border-radius:12px;background:#200b12;color:#fecaca;font:600 12px/1.45 Inter,system-ui,sans-serif;box-shadow:0 16px 45px rgba(0,0,0,.45)';box.innerHTML='El CRM no pudo cargar '+missing.join(' y ')+'. <a href="recuperar-crm.html" style="color:#93c5fd;text-decoration:underline">Recuperar el CRM</a>';document.body.appendChild(box)},4500)},{once:true})})();</script>

<script>
(function(){if(localStorage.getItem(window.SkilledThemeKey||'skilled_tema_almacen')==='claro')document.body.classList.add('tema-claro')})();
let solicitudes=[];let reajustes=[];let tabActual='solicitudes';const currentRole=()=>{try{return String(window.SkilledSession?.role||JSON.parse(localStorage.getItem('skilled_profile_cache')||'{}').rol||'').toLowerCase()}catch(_){return String(window.SkilledSession?.role||'').toLowerCase()}};const canDeleteTest=()=>['administrador','jefe_almacen'].includes(currentRole());
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function badgeEstado(estado){const c={pendiente:['Pendiente','text-amber-300 border-amber-500/30 bg-amber-950/20'],aprobada:['Aprobada','text-emerald-300 border-emerald-500/30 bg-emerald-950/20'],rechazada:['Rechazada','text-rose-300 border-rose-500/30 bg-rose-950/20'],reajuste_pendiente:['Reajuste pendiente','text-blue-300 border-blue-500/30 bg-blue-950/20']}[estado]||[estado,'text-gray-300 border-[#243257]'];return `<span class="px-2 py-1 rounded-full border text-[9px] font-semibold ${c[1]}">${c[0]}</span>`}
function cambiarTab(tab){tabActual=tab;document.getElementById('tab-solicitudes').className=`px-4 py-2.5 text-xs font-semibold ${tab==='solicitudes'?'bg-blue-600 text-white':'bg-[#10172a]'}`;document.getElementById('tab-reajustes').className=`px-4 py-2.5 text-xs font-semibold ${tab==='reajustes'?'bg-blue-600 text-white':'bg-[#10172a]'}`;render()}
function filtros(){const q=document.getElementById('buscar').value.trim().toLowerCase();const p=document.getElementById('filtro-proyecto').value;const e=document.getElementById('filtro-estado').value;return {q,p,e}}
function render(){const {q,p,e}=filtros();if(tabActual==='solicitudes'){const data=solicitudes.filter(x=>(!p||x.proyecto===p)&&(!e||x.estado===e)&&(!q||(window.SkilledSearch?.matches?window.SkilledSearch.matches([x.proyecto,x.proyectoNombre,x.codigo,x.material?.desc,x.material?.descripcion,x.material?.categoria,...(x.material?.modismos||[])],q):[x.proyecto,x.proyectoNombre,x.codigo,x.material?.desc,x.material?.descripcion].some(v=>String(v||'').toLowerCase().includes(q)))));document.getElementById('contenido').innerHTML=data.length?`<div class="overflow-x-auto"><table class="w-full text-xs"><thead><tr class="border-b border-[#243257] text-[10px] uppercase tracking-wider text-gray-500"><th class="px-4 py-3 text-left">Proyecto</th><th class="px-4 py-3 text-left">Material</th><th class="px-4 py-3 text-left">Cantidad requerida</th><th class="px-4 py-3 text-left">Estado</th><th class="px-4 py-3 text-right">Acciones</th></tr></thead><tbody>${data.map(x=>`<tr class="border-b border-[#243257]"><td class="px-4 py-3"><div class="font-semibold text-white">${esc(x.proyecto)}</div><div class="text-[10px] text-gray-500">${esc(x.proyectoNombre)}</div></td><td class="px-4 py-3"><div class="font-semibold text-gray-200">${esc(x.material?.desc||x.material?.descripcion||x.codigo)}</div><div class="font-mono text-[9px] text-blue-300">${esc(x.codigo)}</div>${x.material?.esIncompleto?'<div class="text-[9px] text-amber-400 mt-1">Información incompleta</div>':''}</td><td class="px-4 py-3 font-bold">${x.cantidad} ${esc(x.unidad||x.material?.unidad||'')}</td><td class="px-4 py-3">${badgeEstado(x.estado)}${x.rechazoMotivo?`<div class="text-[9px] text-rose-400 mt-1">${esc(x.rechazoMotivo)}</div>`:''}</td><td class="px-4 py-3 text-right whitespace-nowrap">${x.estado!=='aprobada'?`<button onclick="aprobar('${esc(x.proyecto)}','${esc(x.codigo)}')" class="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-semibold">Aprobar</button>`:''}${x.estado!=='rechazada'?`<button onclick="rechazar('${esc(x.proyecto)}','${esc(x.codigo)}')" class="ml-2 px-3 py-2 rounded-lg border border-rose-500/30 text-rose-300 text-[10px] font-semibold">Rechazar</button>`:''}${canDeleteTest()?`<button onclick="eliminarSolicitudPrueba(${Number(x.id)||0})" class="ml-2 px-3 py-2 rounded-lg border border-rose-500/30 bg-rose-950/10 text-rose-300 text-[10px] font-semibold" title="Eliminar registro de prueba">Eliminar</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="py-16 text-center text-sm text-gray-500">No hay solicitudes con esos filtros.</div>'}else{const data=reajustes.filter(x=>(!p||x.proyecto===p)&&(!e||x.estado===e)&&(!q||(window.SkilledSearch?.matches?window.SkilledSearch.matches([x.proyecto,x.codigo,x.motivo],q):[x.proyecto,x.codigo,x.motivo].some(v=>String(v||'').toLowerCase().includes(q)))));document.getElementById('contenido').innerHTML=data.length?`<div class="divide-y divide-[#243257]">${data.map(x=>`<div class="p-4 flex flex-col lg:flex-row lg:items-center gap-4"><div class="flex-1"><div class="flex items-center gap-2"><span class="font-semibold text-white">${esc(x.proyecto)} · ${esc(x.codigo)}</span>${badgeEstado(x.estado)}</div><div class="mt-2 text-sm"><span class="text-gray-500">Cantidad:</span> <strong>${x.cantidadAnterior}</strong> <span class="text-blue-400">→</span> <strong class="text-blue-300">${x.cantidadPropuesta}</strong></div><p class="text-xs text-gray-400 mt-2">${esc(x.motivo)}</p><p class="text-[10px] text-gray-600 mt-1">Solicitó: ${esc(x.solicitadoPor||'—')}</p></div><div class="flex gap-2">${x.estado==='pendiente'?`<button onclick="resolverReajuste(${x.id},true)" class="px-3 py-2 rounded-lg bg-emerald-600 text-white text-[10px] font-semibold">Aprobar cambio</button><button onclick="resolverReajuste(${x.id},false)" class="px-3 py-2 rounded-lg border border-rose-500/30 text-rose-300 text-[10px] font-semibold">Rechazar</button>`:''}${canDeleteTest()?`<button onclick="eliminarReajustePrueba(${Number(x.id)||0})" class="px-3 py-2 rounded-lg border border-rose-500/30 bg-rose-950/10 text-rose-300 text-[10px] font-semibold">Eliminar</button>`:''}</div></div>`).join('')}</div>`:'<div class="py-16 text-center text-sm text-gray-500">No hay reajustes con esos filtros.</div>'}}
async function aprobar(p,c){try{await SkilledDB.setMaterialRequestStatus(p,c,'aprobada',{usuario:'Almacén'});await cargarTodo()}catch(e){alert(e.message)}}
async function rechazar(p,c){const motivo=prompt('Motivo del rechazo:');if(motivo===null)return;try{await SkilledDB.setMaterialRequestStatus(p,c,'rechazada',{usuario:'Almacén',motivo});await cargarTodo()}catch(e){alert(e.message)}}
async function resolverReajuste(id,ok){if(!confirm(ok?'¿Aprobar y aplicar la nueva cantidad?':'¿Rechazar este reajuste?'))return;try{await SkilledDB.resolveMaterialAdjustment(id,ok,{usuario:'Almacén'});await cargarTodo()}catch(e){alert(e.message)}}
async function eliminarSolicitudPrueba(id){if(!canDeleteTest())return alert('Tu perfil no puede eliminar solicitudes de prueba.');const item=solicitudes.find(x=>Number(x.id)===Number(id));if(!item)return;if(!confirm(`¿Eliminar definitivamente la solicitud ${item.proyecto} · ${item.codigo}?\n\nEsta acción también retira esa línea del plan de materiales del proyecto.`))return;const typed=prompt('Escribe ELIMINAR para confirmar:');if(typed!=='ELIMINAR')return;try{await SkilledDB.deleteMaterialRequestTest(id);await cargarTodo();alert('La solicitud de material de prueba fue eliminada.')}catch(e){alert(e.message)}}
async function eliminarReajustePrueba(id){if(!canDeleteTest())return alert('Tu perfil no puede eliminar reajustes de prueba.');if(!confirm('¿Eliminar definitivamente este reajuste de prueba?'))return;try{await SkilledDB.deleteMaterialAdjustmentTest(id);await cargarTodo();alert('El reajuste de prueba fue eliminado.')}catch(e){alert(e.message)}}
async function cargarTodo(){document.getElementById('contenido').innerHTML='<div class="py-16 text-center text-sm text-gray-500">Cargando...</div>';try{[solicitudes,reajustes,notificaciones]=await Promise.all([SkilledDB.listMaterialRequests(),SkilledDB.listMaterialAdjustments(),SkilledDB.listUnreadNotifications()]);const projects=[...new Map(solicitudes.map(x=>[x.proyecto,x.proyectoNombre])).entries()];document.getElementById('filtro-proyecto').innerHTML='<option value="">Todos los proyectos</option>'+projects.map(([n,name])=>`<option value="${esc(n)}">${esc(n)} — ${esc(name)}</option>`).join('');document.getElementById('m-pendientes').textContent=solicitudes.filter(x=>x.estado==='pendiente').length;document.getElementById('m-aprobadas').textContent=solicitudes.filter(x=>x.estado==='aprobada').length;document.getElementById('m-rechazadas').textContent=solicitudes.filter(x=>x.estado==='rechazada').length;document.getElementById('m-reajustes').textContent=reajustes.filter(x=>x.estado==='pendiente').length;const aviso=document.getElementById('aviso-notificaciones');aviso.classList.toggle('hidden',!notificaciones.length);aviso.textContent=notificaciones.length?`${notificaciones.length} notificación(es) pendiente(s), principalmente reajustes de cantidades solicitadas.`:'';render()}catch(e){document.getElementById('contenido').innerHTML=`<div class="py-16 text-center text-sm text-rose-400">${esc(e.message)}</div>`}}
document.getElementById('buscar').addEventListener('input',render);document.getElementById('filtro-proyecto').addEventListener('change',render);document.getElementById('filtro-estado').addEventListener('change',render);cargarTodo();
</script>
