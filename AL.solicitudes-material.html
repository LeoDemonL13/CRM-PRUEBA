<script id="skilled-boot-recovery">(()=>{'use strict';const RELEASE='105',FLAG='skilled_recovery_once_'+RELEASE;async function clearStale(){try{if(!('serviceWorker'in navigator))return false;const controller=navigator.serviceWorker.controller;if(!controller){try{sessionStorage.removeItem(FLAG)}catch(_){}return false}const script=String(controller.scriptURL||'');if(!/crm-sw\.js/i.test(script)||new RegExp('[?&]v='+RELEASE+'(?:&|$)').test(script))return false;try{if(sessionStorage.getItem(FLAG)==='1')return false;sessionStorage.setItem(FLAG,'1')}catch(_){}const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/^skilled-crm/i.test(k)).map(k=>caches.delete(k).catch(()=>false)))}location.reload();return true}catch(_){return false}}clearStale();window.addEventListener('DOMContentLoaded',()=>{const name=(location.pathname.split('/').pop()||'').toLowerCase();if(/^(login|index|limpiar-cache|recuperar-crm)(?:\.html)?$/.test(name))return;setTimeout(()=>{const missing=[];if(!window.SkilledDB)missing.push('conexión');if(!document.getElementById('skilled-sidebar'))missing.push('menú');if(!missing.length)return;if(document.getElementById('skilled-runtime-warning'))return;const box=document.createElement('div');box.id='skilled-runtime-warning';box.style.cssText='position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:2147483647;width:min(620px,calc(100vw - 24px));padding:12px 14px;border:1px solid #ef4444;border-radius:12px;background:#200b12;color:#fecaca;font:600 12px/1.45 Inter,system-ui,sans-serif;box-shadow:0 16px 45px rgba(0,0,0,.45)';box.innerHTML='El CRM no pudo cargar '+missing.join(' y ')+'. <a href="recuperar-crm.html" style="color:#93c5fd;text-decoration:underline">Recuperar el CRM</a>';document.body.appendChild(box)},4500)},{once:true})})();</script>

<script>
(function(){if(localStorage.getItem(window.SkilledThemeKey||'skilled_tema_almacen')==='claro')document.body.classList.add('tema-claro')})();
let solicitudes=[];let reajustes=[];let tabActual='solicitudes';let notificaciones=[];const proyectosAbiertos=new Set();let aprobacionProyectoEnCurso='';
const currentRole=()=>{try{return String(window.SkilledSession?.role||JSON.parse(localStorage.getItem('skilled_profile_cache')||'{}').rol||'').toLowerCase()}catch(_){return String(window.SkilledSession?.role||'').toLowerCase()}};
const canDeleteTest=()=>['administrador','jefe_almacen'].includes(currentRole());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function badgeEstado(e){const map={pendiente:['Pendiente','amber'],aprobada:['Aprobada','emerald'],rechazada:['Rechazada','rose'],reajuste_pendiente:['Reajuste pendiente','blue'],resuelto:['Resuelto','emerald']};const [l,c]=map[e]||[e,'gray'];return `<span class="inline-flex rounded-full border border-${c}-500/30 bg-${c}-950/20 px-2 py-1 text-[9px] font-semibold text-${c}-300">${esc(l)}</span>`}
function filtros(){return{q:(document.getElementById('buscar').value||'').trim().toLowerCase(),p:document.getElementById('filtro-proyecto').value,e:document.getElementById('filtro-estado').value}}
function cambiarTab(tab){tabActual=tab;document.getElementById('tab-solicitudes').className=`px-4 py-2.5 text-xs font-semibold ${tab==='solicitudes'?'bg-blue-600 text-white':'bg-[#10172a]'}`;document.getElementById('tab-reajustes').className=`px-4 py-2.5 text-xs font-semibold ${tab==='reajustes'?'bg-blue-600 text-white':'bg-[#10172a]'}`;render()}
function coincideSolicitud(x,q){if(!q)return true;const values=[x.proyecto,x.proyectoNombre,x.codigo,x.material?.desc,x.material?.descripcion,x.material?.categoria,...(x.material?.modismos||[])];return window.SkilledSearch?.matches?window.SkilledSearch.matches(values,q):values.some(v=>String(v||'').toLowerCase().includes(q))}
function agruparPorProyecto(data){const map=new Map();data.forEach(x=>{const key=String(x.proyecto||'Sin proyecto');if(!map.has(key))map.set(key,{proyecto:key,nombre:x.proyectoNombre||'',items:[]});map.get(key).items.push(x)});return [...map.values()].sort((a,b)=>String(a.proyecto).localeCompare(String(b.proyecto),'es-MX',{numeric:true}))}
function toggleProyecto(numero){const key=String(numero);if(proyectosAbiertos.has(key))proyectosAbiertos.delete(key);else proyectosAbiertos.add(key);render()}
function renderProyectoGrupo(grupo){const items=grupo.items;const pendientes=items.filter(x=>x.estado==='pendiente').length;const aprobadas=items.filter(x=>x.estado==='aprobada').length;const rechazadas=items.filter(x=>x.estado==='rechazada').length;const reajustesCount=items.filter(x=>x.estado==='reajuste_pendiente').length;const abierto=proyectosAbiertos.has(String(grupo.proyecto));const busy=aprobacionProyectoEnCurso===String(grupo.proyecto);const resumen=[`${items.length} materiales`,pendientes?`${pendientes} pendientes`:'',aprobadas?`${aprobadas} aprobadas`:'',rechazadas?`${rechazadas} rechazadas`:'',reajustesCount?`${reajustesCount} en reajuste`:''].filter(Boolean);return `<article class="project-request-card"><div class="project-request-head"><button type="button" onclick="toggleProyecto('${esc(grupo.proyecto)}')" class="min-w-0 flex-1 flex items-center gap-3 text-left"><span class="w-10 h-10 shrink-0 rounded-xl border border-blue-500/25 bg-blue-950/20 text-blue-300 flex items-center justify-center font-black">${abierto?'−':'+'}</span><span class="min-w-0"><span class="block text-sm font-black text-white">Proyecto ${esc(grupo.proyecto)}</span><span class="block text-[10px] text-gray-500 mt-0.5 truncate">${esc(grupo.nombre||'Sin nombre de proyecto')}</span><span class="flex flex-wrap gap-1.5 mt-2">${resumen.map(v=>`<span class="project-request-count">${esc(v)}</span>`).join('')}</span></span></button><div class="flex items-center gap-2 shrink-0">${pendientes?`<button type="button" onclick="event.stopPropagation();aprobarProyecto('${esc(grupo.proyecto)}')" ${busy?'disabled':''} class="crm-primary !px-3 !py-2 text-[10px]">${busy?'Aprobando…':`Aprobar pendientes (${pendientes})`}</button>`:''}<button type="button" onclick="toggleProyecto('${esc(grupo.proyecto)}')" class="crm-secondary !px-3 !py-2 text-[10px]">${abierto?'Ocultar':'Revisar'}</button></div></div>${abierto?`<div class="project-request-detail"><div class="project-request-row text-[9px] uppercase tracking-wider text-gray-500 font-bold"><div>Material</div><div>Cantidad</div><div>Estado</div><div class="text-right">Acciones</div></div>${items.map(x=>`<div class="project-request-row"><div><div class="font-semibold text-gray-200">${esc(x.material?.desc||x.material?.descripcion||x.codigo)}</div><div class="font-mono text-[9px] text-blue-300 mt-0.5">${esc(x.codigo)}</div>${x.material?.esIncompleto?'<div class="text-[9px] text-amber-400 mt-1">Información incompleta</div>':''}</div><div class="font-bold text-white">${x.cantidad} ${esc(x.unidad||x.material?.unidad||'')}</div><div>${badgeEstado(x.estado)}${x.rechazoMotivo?`<div class="text-[9px] text-rose-400 mt-1">${esc(x.rechazoMotivo)}</div>`:''}</div><div class="project-request-row-actions flex justify-end gap-2 flex-wrap">${x.estado!=='aprobada'?`<button onclick="aprobar('${esc(x.proyecto)}','${esc(x.codigo)}')" class="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-semibold">Aprobar</button>`:''}${x.estado!=='rechazada'?`<button onclick="rechazar('${esc(x.proyecto)}','${esc(x.codigo)}')" class="px-3 py-2 rounded-lg border border-rose-500/30 text-rose-300 text-[10px] font-semibold">Rechazar</button>`:''}${canDeleteTest()?`<button onclick="eliminarSolicitudPrueba(${Number(x.id)||0})" class="px-3 py-2 rounded-lg border border-rose-500/30 bg-rose-950/10 text-rose-300 text-[10px] font-semibold" title="Eliminar registro de prueba">Eliminar</button>`:''}</div></div>`).join('')}</div>`:''}</article>`}
function render(){const {q,p,e}=filtros();if(tabActual==='solicitudes'){const data=solicitudes.filter(x=>(!p||x.proyecto===p)&&(!e||x.estado===e)&&coincideSolicitud(x,q));const grupos=agruparPorProyecto(data);document.getElementById('contenido').innerHTML=grupos.length?`<div class="p-3 md:p-4 space-y-3">${grupos.map(renderProyectoGrupo).join('')}</div>`:'<div class="py-16 text-center text-sm text-gray-500">No hay solicitudes con esos filtros.</div>'}else{const data=reajustes.filter(x=>(!p||x.proyecto===p)&&(!e||x.estado===e)&&(!q||(window.SkilledSearch?.matches?window.SkilledSearch.matches([x.proyecto,x.codigo,x.motivo],q):[x.proyecto,x.codigo,x.motivo].some(v=>String(v||'').toLowerCase().includes(q)))));document.getElementById('contenido').innerHTML=data.length?`<div class="divide-y divide-[#243257]">${data.map(x=>`<div class="p-4 flex flex-col lg:flex-row lg:items-center gap-4"><div class="flex-1"><div class="flex items-center gap-2"><span class="font-semibold text-white">${esc(x.proyecto)} · ${esc(x.codigo)}</span>${badgeEstado(x.estado)}</div><div class="mt-2 text-sm"><span class="text-gray-500">Cantidad:</span> <strong>${x.cantidadAnterior}</strong> <span class="text-blue-400">→</span> <strong class="text-blue-300">${x.cantidadPropuesta}</strong></div><p class="text-xs text-gray-400 mt-2">${esc(x.motivo)}</p><p class="text-[10px] text-gray-600 mt-1">Solicitó: ${esc(x.solicitadoPor||'—')}</p></div><div class="flex gap-2">${x.estado==='pendiente'?`<button onclick="resolverReajuste(${x.id},true)" class="px-3 py-2 rounded-lg bg-emerald-600 text-white text-[10px] font-semibold">Aprobar cambio</button><button onclick="resolverReajuste(${x.id},false)" class="px-3 py-2 rounded-lg border border-rose-500/30 text-rose-300 text-[10px] font-semibold">Rechazar</button>`:''}${canDeleteTest()?`<button onclick="eliminarReajustePrueba(${Number(x.id)||0})" class="px-3 py-2 rounded-lg border border-rose-500/30 bg-rose-950/10 text-rose-300 text-[10px] font-semibold">Eliminar</button>`:''}</div></div>`).join('')}</div>`:'<div class="py-16 text-center text-sm text-gray-500">No hay reajustes con esos filtros.</div>'}}
async function aprobar(p,c){try{await SkilledDB.setMaterialRequestStatus(p,c,'aprobada',{usuario:'Almacén'});proyectosAbiertos.add(String(p));await cargarTodo()}catch(e){alert(e.message)}}
async function aprobarProyecto(proyecto){const pendientes=solicitudes.filter(x=>String(x.proyecto)===String(proyecto)&&x.estado==='pendiente');if(!pendientes.length)return alert('Este proyecto ya no tiene materiales pendientes por aprobar.');if(!confirm(`¿Aprobar de una vez los ${pendientes.length} materiales pendientes del proyecto ${proyecto}?\n\nPodrás seguir revisando cada material en el detalle del proyecto.`))return;aprobacionProyectoEnCurso=String(proyecto);proyectosAbiertos.add(String(proyecto));render();try{const result=await SkilledDB.approveMaterialProjectRequests(proyecto,{usuario:'Almacén'});await cargarTodo();alert(`${Number(result?.actualizadas||pendientes.length)} material(es) aprobados del proyecto ${proyecto}.`)}catch(e){alert(e.message)}finally{aprobacionProyectoEnCurso='';render()}}
async function rechazar(p,c){const motivo=prompt('Motivo del rechazo:');if(motivo===null)return;try{await SkilledDB.setMaterialRequestStatus(p,c,'rechazada',{usuario:'Almacén',motivo});proyectosAbiertos.add(String(p));await cargarTodo()}catch(e){alert(e.message)}}
async function eliminarSolicitudPrueba(id){if(!canDeleteTest())return alert('Tu perfil no puede eliminar solicitudes de prueba.');const item=solicitudes.find(x=>Number(x.id)===Number(id));if(!item)return;if(!confirm(`¿Eliminar definitivamente la solicitud ${item.proyecto} · ${item.codigo}?\n\nEsta acción también retira esa línea del plan de materiales del proyecto.`))return;const typed=prompt('Escribe ELIMINAR para confirmar:');if(typed!=='ELIMINAR')return;try{await SkilledDB.deleteMaterialRequestTest(id);proyectosAbiertos.add(String(item.proyecto));await cargarTodo();alert('La solicitud de material de prueba fue eliminada.')}catch(e){alert(e.message)}}
async function eliminarReajustePrueba(id){if(!canDeleteTest())return alert('Tu perfil no puede eliminar reajustes de prueba.');if(!confirm('¿Eliminar definitivamente este reajuste de prueba?'))return;try{await SkilledDB.deleteMaterialAdjustmentTest(id);await cargarTodo();alert('El reajuste de prueba fue eliminado.')}catch(e){alert(e.message)}}
async function resolverReajuste(id,ok){if(!confirm(ok?'¿Aprobar y aplicar la nueva cantidad?':'¿Rechazar este reajuste?'))return;try{await SkilledDB.resolveMaterialAdjustment(id,ok,{usuario:'Almacén'});await cargarTodo()}catch(e){alert(e.message)}}

async function cargarTodo(){document.getElementById('contenido').innerHTML='<div class="py-16 text-center text-sm text-gray-500">Cargando...</div>';try{[solicitudes,reajustes,notificaciones]=await Promise.all([SkilledDB.listMaterialRequests(),SkilledDB.listMaterialAdjustments(),SkilledDB.listUnreadNotifications()]);const projects=[...new Map(solicitudes.map(x=>[x.proyecto,x.proyectoNombre])).entries()];document.getElementById('filtro-proyecto').innerHTML='<option value="">Todos los proyectos</option>'+projects.map(([n,name])=>`<option value="${esc(n)}">${esc(n)} — ${esc(name)}</option>`).join('');document.getElementById('m-pendientes').textContent=solicitudes.filter(x=>x.estado==='pendiente').length;document.getElementById('m-aprobadas').textContent=solicitudes.filter(x=>x.estado==='aprobada').length;document.getElementById('m-rechazadas').textContent=solicitudes.filter(x=>x.estado==='rechazada').length;document.getElementById('m-reajustes').textContent=reajustes.filter(x=>x.estado==='pendiente').length;const aviso=document.getElementById('aviso-notificaciones');aviso.classList.toggle('hidden',!notificaciones.length);aviso.textContent=notificaciones.length?`${notificaciones.length} notificación(es) pendiente(s), principalmente reajustes de cantidades solicitadas.`:'';render()}catch(e){document.getElementById('contenido').innerHTML=`<div class="py-16 text-center text-sm text-rose-400">${esc(e.message)}</div>`}}
document.getElementById('buscar').addEventListener('input',render);document.getElementById('filtro-proyecto').addEventListener('change',render);document.getElementById('filtro-estado').addEventListener('change',render);cargarTodo();
</script>
