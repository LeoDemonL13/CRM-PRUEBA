<!doctype html>
<html lang="es">
<head>
<link rel="icon" href="/favicon.ico?v=29" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=29">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=29">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=29">
<link rel="manifest" href="/site.webmanifest?v=29">
<meta name="application-name" content="Skilled CRM">
<meta name="apple-mobile-web-app-title" content="Skilled CRM">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Limpiar caché del CRM</title>
<style>
html,body{margin:0;min-height:100%;background:#060814;color:#dbe7f8;font-family:Inter,system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);border:1px solid #243257;border-radius:18px;background:#090d1a;padding:28px;text-align:center;box-shadow:0 28px 80px rgba(0,0,0,.45)}img{width:150px}.status{margin-top:18px;color:#93a4bc;font-size:12px;line-height:1.7}.ok{color:#6ee7b7}
</style>
<script src="skilled-search.js?v=43"></script>
</head>
<body>
<main><section class="card"><img src="logo-reporte.png" alt="Skilled"><div id="status" class="status">Retirando la caché anterior del CRM…</div></section></main>
<script>
(async()=>{
const status=document.getElementById('status');
try{
if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(item=>item.unregister()))}
if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(key=>/^skilled-crm/i.test(key)).map(key=>caches.delete(key)))}
try{sessionStorage.removeItem('skilled_sw_refreshed');localStorage.setItem('skilled_sw_retirado','1');localStorage.setItem('skilled_crm_release','43')}catch(_){}
status.classList.add('ok');status.textContent='Caché corregida. Abriendo el inicio de sesión…';
setTimeout(()=>location.replace('login.html'),700);
}catch(error){status.textContent=`No fue posible limpiar automáticamente: ${error.message}. Abre DevTools → Application → Service Workers y pulsa Unregister.`}
})();
</script>
<script src="skilled-performance.js?v=43" defer></script>
</body>
</html>
