<title>Limpiar caché del CRM</title>
<style>
html,body{margin:0;min-height:100%;background:#060814;color:#dbe7f8;font-family:Inter,system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);border:1px solid #243257;border-radius:18px;background:#090d1a;padding:28px;text-align:center;box-shadow:0 28px 80px rgba(0,0,0,.45)}img{width:150px}.status{margin-top:18px;color:#93a4bc;font-size:12px;line-height:1.7}.ok{color:#6ee7b7}
</style>
<script src="skilled-search.js?v=116"></script>
<script id="skilled-boot-recovery">(()=>{'use strict';const RELEASE='116',FLAG='skilled_recovery_once_'+RELEASE;async function clearStale(){try{if(!('serviceWorker'in navigator))return false;const controller=navigator.serviceWorker.controller;if(!controller){try{sessionStorage.removeItem(FLAG)}catch(_){}return false}const script=String(controller.scriptURL||'');if(!/crm-sw\.js/i.test(script)||new RegExp('[?&]v='+RELEASE+'(?:&|$)').test(script))return false;try{if(sessionStorage.getItem(FLAG)==='1')return false;sessionStorage.setItem(FLAG,'1')}catch(_){}const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/^skilled-crm/i.test(k)).map(k=>caches.delete(k).catch(()=>false)))}location.reload();return true}catch(_){return false}}clearStale();window.addEventListener('DOMContentLoaded',()=>{const name=(location.pathname.split('/').pop()||'').toLowerCase();if(/^(login|index|limpiar-cache|recuperar-crm)(?:\.html)?$/.test(name))return;setTimeout(()=>{const missing=[];if(!window.SkilledDB)missing.push('conexión');if(!document.getElementById('skilled-sidebar'))missing.push('menú');if(!missing.length)return;if(document.getElementById('skilled-runtime-warning'))return;const box=document.createElement('div');box.id='skilled-runtime-warning';box.style.cssText='position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:2147483647;width:min(620px,calc(100vw - 24px));padding:12px 14px;border:1px solid #ef4444;border-radius:12px;background:#200b12;color:#fecaca;font:600 12px/1.45 Inter,system-ui,sans-serif;box-shadow:0 16px 45px rgba(0,0,0,.45)';box.innerHTML='El CRM no pudo cargar '+missing.join(' y ')+'. <a href="recuperar-crm.html" style="color:#93c5fd;text-decoration:underline">Recuperar el CRM</a>';document.body.appendChild(box)},4500)},{once:true})})();</script>
<link rel="stylesheet" href="crm-v83-design.css?v=116"></head>
<body>
<main><section class="card"><img src="logo-reporte.png" alt="Skilled"><div id="status" class="status">Retirando la caché anterior del CRM…</div></section></main>
<script>
(async()=>{
const status=document.getElementById('status');
try{
if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(item=>item.unregister()))}
if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(key=>/^skilled-crm/i.test(key)).map(key=>caches.delete(key)))}
try{sessionStorage.removeItem('skilled_sw_refreshed');localStorage.setItem('skilled_sw_retirado','1');localStorage.setItem('skilled_crm_release','107')}catch(_){}
status.classList.add('ok');status.textContent='Caché corregida. Abriendo el inicio de sesión…';
setTimeout(()=>location.replace('login.html'),700);
}catch(error){status.textContent=`No fue posible limpiar automáticamente: ${error.message}. Abre DevTools → Application → Service Workers y pulsa Unregister.`}
})();
</script>
