<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="/site.webmanifest?v=29">
<meta name="application-name" content="Skilled CRM">
<meta name="apple-mobile-web-app-title" content="Skilled CRM">
<title>Skilled CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="skilled-supabase.js?v=49"></script>
<style>
html,body{margin:0;min-height:100%;background:#060814;color:#cbd5e1;font-family:Inter,system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center}.card{border:1px solid #243257;border-radius:16px;background:#090d1a;padding:28px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.42)}img{width:140px}.dot{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d399}
</style>
<script src="skilled-search.js?v=49"></script>
<script id="skilled-boot-recovery">(()=>{'use strict';const RELEASE='49',FLAG='skilled_recovery_once_'+RELEASE;async function clearStale(){try{if(!('serviceWorker'in navigator))return false;const controller=navigator.serviceWorker.controller;if(!controller){try{sessionStorage.removeItem(FLAG)}catch(_){}return false}const script=String(controller.scriptURL||'');if(!/crm-sw\.js/i.test(script)||new RegExp('[?&]v='+RELEASE+'(?:&|$)').test(script))return false;try{if(sessionStorage.getItem(FLAG)==='1')return false;sessionStorage.setItem(FLAG,'1')}catch(_){}const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/^skilled-crm/i.test(k)).map(k=>caches.delete(k).catch(()=>false)))}location.reload();return true}catch(_){return false}}clearStale();window.addEventListener('DOMContentLoaded',()=>{const name=(location.pathname.split('/').pop()||'').toLowerCase();if(/^(login|index|limpiar-cache|recuperar-crm)(?:\.html)?$/.test(name))return;setTimeout(()=>{const missing=[];if(!window.SkilledDB)missing.push('conexión');if(!document.getElementById('skilled-sidebar'))missing.push('menú');if(!missing.length)return;if(document.getElementById('skilled-runtime-warning'))return;const box=document.createElement('div');box.id='skilled-runtime-warning';box.style.cssText='position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:2147483647;width:min(620px,calc(100vw - 24px));padding:12px 14px;border:1px solid #ef4444;border-radius:12px;background:#200b12;color:#fecaca;font:600 12px/1.45 Inter,system-ui,sans-serif;box-shadow:0 16px 45px rgba(0,0,0,.45)';box.innerHTML='El CRM no pudo cargar '+missing.join(' y ')+'. <a href="recuperar-crm.html" style="color:#93c5fd;text-decoration:underline">Recuperar el CRM</a>';document.body.appendChild(box)},4500)},{once:true})})();</script>
</head>
<body>
<main><div class="card"><img src="logo-reporte.png" alt="Skilled"><p><span class="dot"></span>Preparando tu área de trabajo…</p></div></main>
<script>
(function(){
const routes={administrador:'AL.inicio.html',jefe_almacen:'AL.inicio.html',almacen:'AL.inicio.html',compras:'CO.inicio.html',rh:'RH.inicio.html',finanzas:'FI.inicio.html',proyectos:'AL.proyectos.html',consulta:'AL.inicio.html'};
const go=role=>location.replace(routes[String(role||'').toLowerCase()]||'AL.inicio.html');
let cache=null;
try{cache=JSON.parse(localStorage.getItem('skilled_profile_cache')||'null')}catch(_){}
if(cache?.activo!==false&&cache?.rol){go(cache.rol);return}
(async()=>{
try{
const {data:{session},error:sessionError}=await SkilledDB.client.auth.getSession();
if(sessionError||!session){try{localStorage.removeItem('skilled_profile_cache')}catch(_){}location.replace('login.html?estado=sesion_requerida');return}
const {data:profile,error:profileError}=await SkilledDB.client.from('perfiles_usuario').select('*').eq('id',session.user.id).maybeSingle();
if(profileError){location.replace('login.html?estado=conexion');return}
if(!profile?.activo){await SkilledDB.client.auth.signOut().catch(()=>{});try{localStorage.removeItem('skilled_profile_cache')}catch(_){}location.replace('login.html?estado=sin_acceso');return}
try{localStorage.setItem('skilled_profile_cache',JSON.stringify({...profile,email:session.user.email,fotoUrl:profile.foto_url}))}catch(_){}
go(profile.rol);
}catch(error){console.error(error);location.replace('login.html?estado=conexion')}
})();
})();
</script>
<script src="skilled-performance.js?v=49" defer></script>
</body>
</html>
