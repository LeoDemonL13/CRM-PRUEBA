<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060814"><title>Recuperar CRM Skilled</title><style>html,body{margin:0;min-height:100%;background:#060814;color:#e5edf8;font-family:Inter,system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(460px,100%);box-sizing:border-box;padding:28px;border:1px solid #243257;border-radius:18px;background:#090d1a;box-shadow:0 28px 80px rgba(0,0,0,.45);text-align:center}img{width:150px;max-width:70%;height:auto}.status{margin-top:18px;color:#93a4bc;font-size:12px;line-height:1.7}.ok{color:#6ee7b7}.err{color:#fca5a5}.btn{display:inline-flex;margin-top:18px;padding:10px 15px;border:1px solid #31517f;border-radius:10px;background:#13203a;color:#dbeafe;text-decoration:none;font-size:12px;font-weight:700}</style><link rel="stylesheet" href="crm-v83-design.css?v=90"></head><body><main><section class="card"><img src="logo-reporte.png" alt="Skilled"><div id="status" class="status">Recuperando los recursos del CRM…</div><a id="continue" class="btn" href="login.html?r=104" hidden>Continuar</a></section></main><script>(async()=>{const el=document.getElementById('status'),btn=document.getElementById('continue');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/^skilled-crm/i.test(k)).map(k=>caches.delete(k).catch(()=>false)))}try{localStorage.setItem('skilled_crm_release','104');localStorage.removeItem('skilled_sw_retirado');sessionStorage.removeItem('skilled_recovery_once_104')}catch(_){}el.className='status ok';el.textContent='Recuperación terminada. Abriendo el inicio de sesión…';setTimeout(()=>location.replace('login.html?r=104'),900)}catch(e){el.className='status err';el.textContent='No se pudo completar automáticamente: '+e.message;btn.hidden=false}})();</script><script src="crm-v78-fixes.js?v=89" defer></script><script src="crm-v83-shell.js?v=89" defer></script></body></html>
