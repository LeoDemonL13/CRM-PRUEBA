<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skilled Checador</title><style>*{box-sizing:border-box}body{margin:0;background:#050914;color:#e8eef7;font-family:Arial,sans-serif;display:grid;min-height:100vh;place-items:center}.card{width:min(720px,94vw);border:1px solid #1b2b47;background:#091120;border-radius:24px;padding:28px;box-shadow:0 24px 80px #0008}.brand{font-size:36px;font-weight:900;color:#0b6ea8}.brand b{color:#ea0029}.muted{color:#8292aa}.clock{font-size:52px;font-weight:900;margin:24px 0 4px}.input{width:100%;padding:18px;border-radius:14px;border:1px solid #263a5d;background:#050b17;color:white;font-size:22px;outline:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}button{padding:16px;border-radius:14px;border:1px solid #274064;background:#0d1a31;color:#dce8f7;font-weight:800;font-size:16px;cursor:pointer}.primary{background:#0b6ea8}.danger{background:#461323;border-color:#7d1f3b}.ok{background:#0d392e;border-color:#18785d}.status{margin-top:16px;padding:14px;border-radius:14px;border:1px solid #223653;background:#070e1c;min-height:52px}.recent{margin-top:20px;max-height:260px;overflow:auto}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid #15233b;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}.clock{font-size:40px}}</style></head><body><main class="card"><div class="brand">Skilled <b>•</b> Checador</div><div class="muted">Terminal local · funciona aun sin internet</div><div id="clock" class="clock"></div><div id="date" class="muted"></div><div style="margin-top:24px"><input id="employee" class="input" placeholder="Número de empleado" autocomplete="off"></div><div class="grid"><button class="ok" data-type="entrada">Entrada</button><button class="primary" data-type="auto">Automático</button><button class="danger" data-type="salida">Salida</button></div><div id="status" class="status muted">Listo para registrar.</div><div class="recent"><div class="muted" style="font-size:12px;font-weight:800">REGISTROS RECIENTES</div><div id="recent"></div></div></main><script>const $=id=>document.getElementById(id);function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('date').textContent=d.toLocaleDateString('es-MX',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}setInterval(tick,1000);tick();async function load(){const r=await fetch('/api/status');const j=await r.json();$('recent').innerHTML=(j.recent||[]).map(x=>`<div class="row"><span>${x.employee_number} · ${String(x.type).toUpperCase()}</span><span>${new Date(x.timestamp).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}${x.synced?' · ✓':' · local'}</span></div>`).join('');}async function punch(type){const employee=$('employee').value.trim();if(!employee)return;$('status').textContent='Registrando…';try{const r=await fetch('/api/punch',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({employee_number:employee,type})});const j=await r.json();if(!j.ok)throw new Error(j.error);$('status').textContent=`${j.event.employee_number} · ${String(j.event.type).toUpperCase()} · ${new Date(j.event.timestamp).toLocaleTimeString('es-MX')}`;$('employee').value='';load();}catch(e){$('status').textContent=e.message}finally{$('employee').focus()}}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>punch(b.dataset.type));$('employee').addEventListener('keydown',e=>{if(e.key==='Enter')punch('auto')});load();setInterval(load,10000);$('employee').focus();</script></body></html>
